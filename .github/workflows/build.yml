
name: Build Mosaedy APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Restore Android folders
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for f in Path(".").glob("app__*"):
              dest = Path(*f.name.split("__"))
              dest.parent.mkdir(parents=True, exist_ok=True)
              f.rename(dest)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mosaedy-APK
          path: app/build/outputs/apk/debug/*.apk
